<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email · CAS</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #121826;
      --border: #1f2937;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #06b6d4;
      --accent-hover: #22d3ee;
      --success: #10b981;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px;
      max-width: 480px; width: 100%; text-align: center;
    }
    .logo { color: var(--accent-hover); font-size: 22px; font-weight: 700;
            letter-spacing: 2px; margin-bottom: 4px; }
    .tagline { color: var(--muted); font-size: 11px; letter-spacing: 1.5px;
               text-transform: uppercase; margin-bottom: 32px; }
    .icon { font-size: 48px; margin-bottom: 16px; display: block; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    .status-success h1 { color: var(--success); }
    .status-error h1 { color: var(--error); }
    .btn {
      display: inline-block; background: var(--accent);
      color: var(--bg); padding: 12px 28px; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: 14px;
      transition: background 0.2s; border: none; cursor: pointer;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent; color: var(--accent-hover);
      border: 1px solid var(--border); margin-left: 8px;
    }
    .resend-form {
      margin-top: 24px; padding-top: 24px;
      border-top: 1px solid var(--border); display: none;
    }
    .resend-form.active { display: block; }
    input[type="email"] {
      width: 100%; padding: 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: 14px; margin-bottom: 12px;
    }
    input[type="email"]:focus { outline: none; border-color: var(--accent); }
    .loading { color: var(--muted); }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">CAS</div>
    <div class="tagline">Conjunction Decision Support</div>
    <span class="icon" id="icon">⏳</span>
    <h1 id="heading">Verifying your email…</h1>
    <p id="message" class="loading">Please wait a moment.</p>
    <div id="actions"></div>
    <div class="resend-form" id="resend-form">
      <p style="margin-bottom:12px;font-size:13px;">Need a new verification link?</p>
      <input type="email" id="resend-email" placeholder="you@example.com" autocomplete="email">
      <button class="btn" onclick="resendEmail()">Send new link</button>
      <p id="resend-status" style="margin-top:12px;font-size:13px;"></p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const card = document.getElementById("card");
    const icon = document.getElementById("icon");
    const heading = document.getElementById("heading");
    const message = document.getElementById("message");
    const actions = document.getElementById("actions");
    const resendForm = document.getElementById("resend-form");

    async function verify() {
      if (!token) {
        showError("No verification token provided.", true);
        return;
      }
      try {
        const res = await fetch("/api/auth/verify-email?token=" + encodeURIComponent(token));
        const data = await res.json();
        if (data.ok) {
          showSuccess(data.message || "Email verified successfully.");
        } else {
          showError(data.message || "Verification failed.", true);
        }
      } catch (e) {
        showError("Network error. Please try again later.", true);
      }
    }

    function showSuccess(msg) {
      card.classList.remove("status-error");
      card.classList.add("status-success");
      icon.textContent = "✓";
      icon.style.color = "var(--success)";
      heading.textContent = "Email verified";
      message.textContent = msg;
      message.classList.remove("loading");
      actions.innerHTML = '<a href="/portal.html" class="btn">Go to login</a>';
    }

    function showError(msg, showResend) {
      card.classList.remove("status-success");
      card.classList.add("status-error");
      icon.textContent = "✕";
      icon.style.color = "var(--error)";
      heading.textContent = "Verification failed";
      message.textContent = msg;
      message.classList.remove("loading");
      actions.innerHTML = '<a href="/" class="btn btn-secondary">Back to home</a>';
      if (showResend) resendForm.classList.add("active");
    }

    async function resendEmail() {
      const email = document.getElementById("resend-email").value.trim();
      const status = document.getElementById("resend-status");
      if (!email || !email.includes("@")) {
        status.textContent = "Please enter a valid email.";
        status.style.color = "var(--error)";
        return;
      }
      status.textContent = "Sending…";
      status.style.color = "var(--muted)";
      try {
        const res = await fetch("/api/auth/resend-verification", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({email})
        });
        const data = await res.json();
        status.textContent = data.message || "Request processed.";
        status.style.color = data.ok ? "var(--success)" : "var(--muted)";
      } catch (e) {
        status.textContent = "Network error. Please try again.";
        status.style.color = "var(--error)";
      }
    }

    verify();
  </script>
</body>
</html>
