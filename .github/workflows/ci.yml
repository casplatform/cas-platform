name: CI

# Every push and every pull request. This is the same suite scripts/deploy.sh
# runs as its gate before it touches production; running it here means a broken
# commit is known before anyone reaches for the deploy script.
on:
  push:
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Same major as both servers run (PostgreSQL 16.14). The baseline
        # revision is a pg_dump of that server, so an older major would trip
        # over syntax the dump takes for granted.
        image: postgres:16
        env:
          # Throwaway credentials for a container that lives for one job and
          # listens only on the runner's loopback. Nothing real belongs here:
          # no test in this suite talks to Space-Track, EU SST, DISCOS or SMTP
          # (they read the database or the source tree), so CI needs no secrets
          # at all. Keep it that way -- a workflow that needs a secret is a
          # workflow that can leak one.
          POSTGRES_USER: cas
          POSTGRES_PASSWORD: cas
          POSTGRES_DB: casdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # WHY THE NAME MUST END IN "_test": tests/integration/conftest.py refuses
      # to run against any other database -- and it does so with pytest.exit,
      # which aborts the whole session rather than one test. The guard is there
      # because these tests COMMIT (AUTH.register and friends); it is what keeps
      # a misconfigured run from writing into casdb. A CI database is disposable,
      # but the guard does not know that, so the name still has to satisfy it.
      #
      # WHY IT MUST BE SET EXPLICITLY: with no TEST_DB_URL the conftest derives
      # the test database from the instance's .env, and a checkout has no .env.
      # Derivation then yields nothing and collection aborts with rc=2.
      TEST_DB_URL: postgresql://cas:cas@127.0.0.1:5432/casdb_test
      # Every module resolves its tree from CAS_HOME -- core/paths.py,
      # cas_engine.py, and the two test modules that used to read /opt/cas
      # directly (the catalog cache and the Kelvins dataset). A runner has no
      # /opt/cas at all, so this is what makes those lookups land in the
      # checkout instead of failing on an absent absolute path.
      CAS_HOME: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 is what both instances run (3.12.3).
          python-version: "3.12"
          # setup-python's built-in pip cache rather than actions/cache: the key
          # is a hash of the files listed below and constraints.txt is one of
          # them, so changing a pin invalidates the cache instead of silently
          # reusing the wheels of the previous pin set. actions/cache would need
          # the same hashFiles() written by hand, for nothing.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ops.txt
            constraints.txt

      - name: Install runtime and test dependencies
        # -c constraints.txt is not decoration. Measured on a clean venv without
        # it: 22 transitive packages resolved to versions other than the ones
        # production runs (starlette 1.2.1 -> 1.6.0, numba 0.64 -> 0.67,
        # typing_extensions 4.15 -> 4.16, urllib3 2.0.7 -> 2.7.0, ...). A green
        # run on a tree nobody deploys is not a gate. The constrained install is
        # also the faster one -- 101s against 192s -- because pip stops
        # backtracking through candidate versions.
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Install Alembic (ops-only dependency)
        # Deliberately a separate step and a separate file: alembic is not a
        # runtime or a test dependency (no service imports it), and
        # requirements-ops.txt exists precisely so that CI does not carry it as
        # one. CI installs it for exactly one reason -- the next step.
        run: pip install -r requirements-ops.txt -c constraints.txt

      - name: Build the schema with Alembic
        # The schema is NOT loaded from schema.sql. Running the migrations
        # against an empty database is itself a test: it proves the baseline
        # revision plus everything after it still reconstructs the whole
        # production schema. That was verified once by hand -- 28 tables,
        # table list identical to production's -- and this step is what keeps
        # it true. A future migration that only works against an
        # already-populated database fails here, on a push, instead of during a
        # deploy.
        #
        # DB_URL is set for this step alone, not job-wide. migrations/env.py
        # prefers DB_URL over everything else and deliberately has no CAS_HOME
        # default. Job-wide it would also be read by cas_engine's managers at
        # import time, where the unit tests want the unreachable sentinel that
        # tests/conftest.py installs.
        env:
          DB_URL: postgresql://cas:cas@127.0.0.1:5432/casdb_test
        run: python -m alembic upgrade head

      - name: Run the suite (unit + integration)
        # tests/smoke is excluded on purpose, and excluded rather than left to
        # fail: those tests GET http://127.0.0.1:8765 and :8766 and read
        # /opt/cas/.env, and they assert things like "tracked_objects > 1000"
        # and "the sync has run recently". That is the state of a running
        # deployment, not the behaviour of the code in this commit. A runner has
        # no deployment, so every one of them would fail for a reason that says
        # nothing about the change. They stay in the tree and keep running
        # against staging and production, where the question means something.
        #
        # Expected: 436 collected, 417 passed, 19 skipped. The skips are all
        # data that a checkout does not carry: 12 catalog-cache tests (the cache
        # is written by the sync, not the repo), 4 Kelvins Layer-3 tests (the
        # dataset is gitignored), 2 EU SST tests needing sync_state rows, and
        # the last-admin guard that cannot be isolated. A skip count that climbs
        # above 19 means something stopped running -- find out what.
        #
        # The collected count rose from 400 on 2026-08-20: the /opt/cas scan in
        # tests/test_env_robustness.py is parametrised per file and now covers
        # the root scripts and ml/src as well as cas_api. Verified by running
        # this exact command against a tracked-files-only checkout with no
        # .env, CAS_HOME on the checkout and an empty Alembic-built database.
        run: python -m pytest -q --ignore=tests/smoke

  secrets:
    # A SEPARATE JOB, not a step in `test`. Three reasons, in order of weight:
    #
    # 1. It needs a different checkout. Scanning history requires
    #    fetch-depth: 0, and the test job deliberately keeps the default
    #    shallow fetch -- it only ever compiles and runs the tip. Making one
    #    job serve both would mean fetching every commit for a job that needs
    #    exactly one.
    # 2. It shares nothing with `test`. No postgres service, no Python, no
    #    pip install. As a step it would sit behind ~100s of dependency
    #    installation and a container health-check for a scan that takes two
    #    seconds, or run in front of them and waste the service spin-up on a
    #    job that may be about to fail.
    # 3. The two answers are independent and both are wanted. "The tests fail"
    #    and "a credential is committed" are unrelated facts about a push. In
    #    one job the first failure hides the second; as separate jobs both
    #    appear on the same run and neither masks the other.
    #
    # It costs nothing in wall-clock: ~40s, entirely in parallel with a test
    # job measured in minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # THE WHOLE POINT OF THIS JOB. The default shallow fetch gives one
          # commit, and `gitleaks git` scans commit DIFFS -- so on a shallow
          # checkout it only inspects what the tip changed. A secret committed
          # once and never touched again is invisible to any diff-scoped scan.
          # Measured on this repository with the Cesium ion token in
          # static/catalog.html, back when it still produced a finding: the
          # full-history scan reported it, and a --log-opts="-1 HEAD" scan of
          # the same tree reported nothing at all, because the token arrived in
          # the initial commit and no later commit touches that line. That
          # token is now allowlisted in .gitleaks.toml as a public client key,
          # so it is no longer a live example -- but the asymmetry it measured
          # is the reason for the line below.
          # fetch-depth: 0 is what makes the answer mean
          # "this repository is clean" rather than "this push added nothing".
          fetch-depth: 0

      - name: Install gitleaks
        # Pinned to the version this job was written against and the version
        # the allowlist in .gitleaks.toml was validated against. The pin is
        # not caution for its own sake: gitleaks ships its ruleset inside the
        # binary, so an unpinned install can start failing on a commit that
        # changed nothing, and the config here was tuned to 8.30.1's exact
        # allowlist semantics (see the note there about path allowlists being
        # a file pre-filter rather than a finding filter).
        #
        # Deliberately not gitleaks-action: for a repository owned by an
        # organisation it wants a GITLEAKS_LICENSE secret, and this workflow's
        # one standing property is that it needs no secrets at all. A workflow
        # that holds a secret is a workflow that can leak one -- a poor trade
        # for the job whose purpose is finding leaked secrets.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Scan the full history for secrets
        # --redact is not optional. Without it a finding prints the matched
        # credential straight into the run log, where everyone who can see
        # Actions can read it and where it stays after the commit is fixed.
        # Redacting costs nothing that matters: the report still names the
        # rule, the file, the line and the commit, which is all you need to go
        # look at the value in a local checkout.
        #
        # No --exit-code override: a finding fails the job. The argument for
        # failing rather than warning is that this is the one defect class
        # that gets strictly worse with time. A committed secret is published
        # the moment it is pushed, and every commit layered on top raises the
        # cost of the history rewrite that removes it. A warn-only scanner
        # becomes a line of yellow text nobody reads, which is the same as not
        # having one.
        #
        # The obligation that comes with failing hard is that a red run must
        # always mean something new -- so false positives get justified
        # allowlist entries in .gitleaks.toml and resolved findings get
        # fingerprints in .gitleaksignore, rather than anyone learning to
        # click past this job.
        #
        # ── WHY THE TWO GUARDS BELOW EXIST ───────────────────────────────────
        #
        # `gitleaks git` reports success when it has scanned nothing. Measured:
        # run against a repository git refuses to read (a copy owned by another
        # user, which trips git's dubious-ownership check), it logs one ERR
        # line -- "stderr is not empty" -- then prints "0 commits scanned",
        # "no leaks found", and exits 0. A green gate that inspected no code.
        # This is the same failure the diagnostic-query rule in CLAUDE.md is
        # about: an empty result reported as a clean result.
        #
        # Guard 1 catches the checkout regression. If fetch-depth: 0 is ever
        # dropped from the step above, the scan silently narrows to the tip
        # commit -- and the commit counts still agree, so guard 2 would pass.
        # Only asking git whether the repository is shallow catches it.
        #
        # Guard 2 catches the silent-git failure. gitleaks' own "N commits
        # scanned" line has to match what git says the history contains;
        # anything else means the walk did not finish.
        #
        # --no-merges is load-bearing, not tidiness. gitleaks walks commits the
        # way `git log -p` does and does not count merge commits. Measured on a
        # scratch history of three ordinary commits plus one merge: git says 4,
        # gitleaks says "3 commits scanned". Comparing against the plain count
        # would fail this guard on a clean repository -- and it would do so on
        # every pull_request run, because actions/checkout checks out the
        # synthetic refs/pull/N/merge commit, which is a merge. main is linear
        # today (git rev-list --merges --count HEAD is 0), so push events would
        # have stayed green and hidden it. Both counts are 42 here now.
        #
        # --no-color so the count is parseable: with colour on, the log line
        # is wrapped in ANSI escapes.
        run: |
          set -uo pipefail

          if ! shallow=$(git rev-parse --is-shallow-repository 2>&1); then
            echo "::error::git cannot read this checkout, so nothing can be scanned."
            echo "${shallow}"
            exit 1
          fi
          if [ "${shallow}" != "false" ]; then
            echo "::error::Shallow checkout: gitleaks would only see the tip commit."
            echo "Restore 'fetch-depth: 0' on the checkout step in this job."
            exit 1
          fi

          if ! expected=$(git rev-list --count --no-merges HEAD 2>&1); then
            echo "::error::git cannot enumerate this history: ${expected}"
            exit 1
          fi
          echo "History to scan: ${expected} commits."

          gitleaks git \
            --no-banner \
            --no-color \
            --redact \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            . 2>&1 | tee gitleaks.log
          status=${PIPESTATUS[0]}

          scanned=$(sed -n 's/.*[^0-9]\([0-9][0-9]*\) commits scanned.*/\1/p' gitleaks.log | tail -1)
          if [ -z "${scanned}" ] || [ "${scanned}" != "${expected}" ]; then
            echo "::error::gitleaks scanned '${scanned:-<no count reported>}' of ${expected} commits."
            echo "The history walk did not complete, so a clean result would be meaningless."
            exit 1
          fi

          if [ "${status}" -ne 0 ]; then
            echo "::error::gitleaks found committed secrets across ${scanned} commits."
            echo "Values are redacted here on purpose -- see the gitleaks-report"
            echo "artifact for rule, file, line and commit, then inspect locally."
            exit "${status}"
          fi

          echo "Clean: ${scanned} commits scanned, no findings."

      - name: Upload the scan report
        # if: always() so the report survives the failure it describes -- that
        # is the run where it is actually wanted.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            gitleaks.log
          if-no-files-found: ignore
