# CAS — Nginx config
# Install to: /etc/nginx/sites-available/cas.conf
# Enable with: ln -s /etc/nginx/sites-available/cas.conf /etc/nginx/sites-enabled/
#
# Architecture:
#   Cloudflare Tunnel (public HTTPS) → localhost:80 (this Nginx) → localhost:8765 (cas engine)
#
# Nginx only listens on 127.0.0.1:80 — never exposed publicly.
# UFW rules: only port 22 (SSH) open to the internet. Port 80/8765 are LAN-only.
#
# Replace YOUR_DOMAIN with your actual domain once registered, e.g. cas.yourdomain.com

# WebSocket connection upgrade map (http-level)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''  close;
}

upstream cas_engine {
    server 127.0.0.1:8765;
    keepalive 4;
    # Development: disable browser caching for static files
}

server {
    listen 80;
    server_name casplatform.com www.casplatform.com;

    # ── Security headers ─────────────────────────────────────────────────────
    # Cloudflare adds X-Frame-Options / HSTS at the edge, but set sane defaults
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Static frontend ──────────────────────────────────────────────────────
    root  /opt/cas/static;
    index landing.html index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ── API reverse proxy → CAS Engine ──────────────────────────────────────

    # FastAPI cas-api (port 8766) — yeni endpoint'ler /api/v2/*
    location /api/v2/ {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # WebSocket upgrade (for /api/v2/ws/*)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long-lived WS connections need a long read timeout (poll interval 15s
        # + heartbeat); REST calls under /api/v2/ are unaffected (they finish fast).
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
    }

    location /api/ {
        # Strip /api prefix before forwarding
        rewrite ^/api/(.*) /$1 break;

        proxy_pass         http://cas_engine;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";      # keep-alive to upstream
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Engine can be slow on heavy TLE analysis
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;

        # Buffer responses in memory — avoids half-written JSON to client
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }
location = /sitemap.xml {
    root /opt/cas/static;
    add_header Cache-Control "public, max-age=3600";
}
    # ── Health check (Cloudflare monitors this) ──────────────────────────────
    location = /catalog.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location /stats/ {
        proxy_pass              http://cas_engine;
        proxy_buffering         off;
        proxy_read_timeout      60s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /catalog/ {
        proxy_pass              http://cas_engine;
        proxy_buffering         off;
        proxy_read_timeout      120s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /tle/ {
        rewrite ^/tle/(.*) /tle/$1 break;
        proxy_pass http://cas_engine;
        proxy_read_timeout 30s;
    }

    location /history {
        rewrite ^/history(.*) /history$1 break;
        proxy_pass http://cas_engine;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://cas_engine/health;
        proxy_read_timeout 5s;
        access_log off;
    }

    # ── Allow .well-known (security.txt, ACME) before the dotfile block ──────
    location ^~ /.well-known/ {
        root /opt/cas/static;
        add_header Cache-Control "public, max-age=3600";
        default_type text/plain;
    }

    # ── Block backup / temporary / source files (never serve these) ──────────
    # Two patterns: extension at end (file.html.bak) and mid-name (file.html.bak.20260411)
    location ~* \.(bak|backup|old|orig|save|swp|swo|tmp|dump|sql|log|py|sh|ini|conf|env|dist)$ {
        deny all;
        return 404;
    }
    location ~* \.(bak|backup|old|orig|save|broken|pre-restore)[._-] {
        deny all;
        return 404;
    }

    # ── Block direct access to .env and internal paths ───────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      application/json text/plain text/css application/javascript;
    gzip_min_length 512;
    # Development: disable browser caching for static files
}
